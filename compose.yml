version: "3.9"
services:
  postgres:
    image: postgres:19.0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=aisu
      - POSTGRES_USER=aisu
      - POSTGRES_PASSWORD=4ab4008b362142c391cc9e1ab98addc6b25f00f5
  redis:
    image: redis:8.10.3
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  postgres_data:
  redis_data:
